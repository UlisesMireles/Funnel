<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '35rem', heigth: '25rem' }"
  (onHide)="close()"
  (onShow)="onDialogShow()"
  class="bodyDialog"
>
  <ng-template pTemplate="header">
    <h6 *ngIf="!insertar" class="margen">{{ title + empresa.nombreEmpresa }}</h6>
    <h6 *ngIf="insertar" class="margen">Nueva Empresa</h6>
  </ng-template>

  <ng-template pTemplate="content">
    <style>
      .error-label {
        color: red;
        font-weight: bold;
      }
    </style>

    <form [formGroup]="formEmpresas">
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="nombreEmpresa">Nombre de Empresa: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input pInputText class="inptSize" id="nombreEmpresa" formControlName="nombreEmpresa" />&nbsp;
          <span *ngIf="esCampoInvalido('nombreEmpresa')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="alias">Alias: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input pInputText class="inptSize" id="alias" formControlName="alias" (change)="onAliasChange($event)" />&nbsp;
          <span *ngIf="esCampoInvalido('alias')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="url">Url de sitio: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input pInputText class="inptSize" id="urlSitio" formControlName="urlSitio" />&nbsp;
          <span *ngIf="esCampoInvalido('urlSitio')" class="text-danger">*</span><span *ngIf="esCampoInvalido('usuario')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="rfc">RFC: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input pInputText class="inptSize" id="rfc" formControlName="rfc"  maxlength="13" />&nbsp;
          <span *ngIf="esCampoInvalido('rfc')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="Licencia">Licencia: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <p-select [options]="licenciasDropdown" formControlName="idLicencia" optionValue="idLicencia"
            optionLabel="nombreLicencia" class="inptSize w-full md:w-70" placeholder="Selecciona una licencia" />&nbsp;
          <span *ngIf="esCampoInvalido('idLicencia')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4">
          <label for="NombreAdmin">Nombre (del administrador): </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input pInputText class="inptSize" id="nombre" formControlName="nombre"/>&nbsp;
          <span *ngIf="esCampoInvalido('nombre')" class="text-danger">*</span>
        </div>
      </div>
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="APaterno">Apellido Paterno: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input
            pInputText
            id="ApellidoPaterno"
            class="inptSize"
            formControlName="apellidoPaterno"
          />&nbsp;
          <span *ngIf="esCampoInvalido('apellidoPaterno')" class="text-danger">*</span>
        </div>
      </div>
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="AMaterno"> Apellido Materno: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input
            pInputText
            id="ApellidoMaterno"
            class="inptSize"
            formControlName="apellidoMaterno"
          />&nbsp;
        </div>
      </div>
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="Usuario"> Usuario: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input
            pInputText
            id="Usuario"
            class="inptSize"
            formControlName="usuario"
          />
          &nbsp;
          <span *ngIf="esCampoInvalido('usuario')" class="text-danger">*</span>
        </div>
  
      </div>
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="Correo"> Correo: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <input
            pInputText
            id="Correo"
            class="inptSize"
            formControlName="correo"
          />&nbsp;
          <span *ngIf="esCampoInvalido('correo')" class="text-danger">*</span>
        </div>
      </div>
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="fInicio">Inicio: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <p-datepicker class="inptSize" formControlName="vInicio" [iconDisplay]="'input'" [showIcon]="true"
            inputId="icondisplay" dateFormat="dd/mm/yy" />
          <span *ngIf="esCampoInvalido('vInicio')" class="text-danger">*</span>
        </div>
      </div>
  
      <div class="row inptSpace">
        <div class="col-sm-4 lbl">
          <label for="fTerminacion">Terminación: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <p-datepicker class="inptSize" formControlName="vTerminacion" [iconDisplay]="'input'" [showIcon]="true"
            inputId="icondisplay" dateFormat="dd/mm/yy" />
          <span *ngIf="esCampoInvalido('vTerminacion')" class="text-danger">*</span>
        </div>
      </div>
      <div class="row inptSpace" *ngIf="!insertar">
        <div class="col-sm-4 lbl">
          <label for="Estatus"> Estatus: </label>
        </div>
        <div class="col-sm-8 inptSpace">
          <p-checkbox formControlName="activo" [binary]="true" />
        </div>
      </div>
      <div class="row align-items-center">
  <div class="col-sm-2">
    <label for="foto" class="form-label" style="margin-right: 50px; margin-top: 25px;">Foto:</label>
  </div>
  <div class="col-sm-10 d-flex align-items-center" style="padding-left: 86px;">
    <!-- Mostrar selector cuando no hay imagen seleccionada -->
    <ng-container *ngIf="!imagePreview">
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
        <input type="text" class="form-control form-control-sm me-0" placeholder="" disabled style="max-width: 150px;" />
        <button class="btn btn-sm btn-seleccionar" (click)="abrirInput()">Seleccionar</button>
        <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" hidden />
      </div>
    </ng-container>

    <!-- Mostrar vista previa cuando hay imagen -->
    <ng-container *ngIf="imagePreview">
      <div style="display: flex; align-items: center; gap: 15px;">
        <!-- Vista previa de la imagen -->
        <div 
          [style.border-radius]="imagePreview === rutaImgenDefault ? '0' : '50%'"
          [style.overflow]="imagePreview === rutaImgenDefault ? 'visible' : 'hidden'"
          style="width: 115px; height: 115px; margin-right: 30px; display: flex; justify-content: center; align-items: center;"
        >
          <img 
            [src]="imagePreview" 
            alt="Vista previa" 
            [style.object-fit]="imagePreview === rutaImgenDefault ? 'contain' : 'cover'"
            [style.width]="imagePreview === rutaImgenDefault ? 'auto' : '100%'"
            [style.height]="imagePreview === rutaImgenDefault ? 'auto' : '100%'"
            style="max-width: 100%; max-height: 100%;"
          >
        </div>
        <button class="btn btn-link text-danger p-0" style="margin-right: 60px;" (click)="removerFoto()">
          <span class="me-1">❌</span> Remover
        </button>
      </div>
    </ng-container>          
  </div>
</div>
    </form>


  </ng-template>

  <ng-template pTemplate="footer">
    <button
      *ngIf="!insertar"
      pButton
      label="Actualizar"
      (click)="actualizaEmpresa()"
      severity="secondary"
    ></button>
    <button
      *ngIf="insertar"
      pButton
      label="Agregar"
      (click)="guardarEmpresa()"
      severity="secondary"
    ></button>
    <button
      pButton
      label="Cancelar"
      (click)="close()"
      severity="secondary"
    ></button>
  </ng-template>
</p-dialog>
